name: Verify test server runtime

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-remote-gateway-runtime-verify
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve expected deployment SHA
    if: github.event.issue.number == 4 && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      expected_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout deployment history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve latest deployment trigger commit
        id: target
        run: |
          set -euo pipefail
          sha=$(git log -1 --format=%H -- .deploy/trigger)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  verify-primary:
    name: Verify primary runtime
    needs: resolve
    runs-on: ubuntu-latest
    environment: server-primary
    outputs:
      deployed_sha: ${{ steps.verify.outputs.deployed_sha }}
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/verify_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/verify_key"
          test -s "$HOME/.ssh/known_hosts"

      - name: Verify deployed SHA, health, UI, and prior real-Codex smoke
        id: verify
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
        run: bash scripts/verify-remote-runtime.sh primary

  verify-secondary:
    name: Verify secondary runtime
    needs: [resolve, verify-primary]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    environment: server-secondary
    outputs:
      deployed_sha: ${{ steps.verify.outputs.deployed_sha }}
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/verify_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/verify_key"
          test -s "$HOME/.ssh/known_hosts"

      - name: Verify deployed SHA, health, UI, and prior real-Codex smoke
        id: verify
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
        run: bash scripts/verify-remote-runtime.sh secondary

  publish:
    name: Publish verification pointer
    needs: [resolve, verify-primary, verify-secondary]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
      PRIMARY_RESULT: ${{ needs.verify-primary.result }}
      SECONDARY_RESULT: ${{ needs.verify-secondary.result }}
    steps:
      - name: Update fixed verification issue
        run: |
          set -euo pipefail
          overall=FAIL
          if [ "$PRIMARY_RESULT" = success ] && [ "$SECONDARY_RESULT" = success ]; then
            overall=PASS
          fi

          body=$(cat <<EOF
          # Latest runtime verification

          - Overall: **$overall**
          - Expected deployment SHA: \`$EXPECTED_SHA\`
          - Primary configured target: \`$PRIMARY_RESULT\`
          - Secondary configured target: \`$SECONDARY_RESULT\`
          - Checks: deployed SHA, Actuator health, browser UI/workspace API, prior real-Codex two-turn smoke/thread evidence
          - Workflow run: \`${GITHUB_RUN_ID}\`

          Detailed job logs expose only generic verification failure categories. This public pointer intentionally omits private host identifiers, network endpoints, usernames, and credentials. Reopen this issue to request another read-only runtime verification.
          EOF
          )

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/4" \
            -f body="$body" >/dev/null

          echo "Runtime verification pointer updated: $overall"
