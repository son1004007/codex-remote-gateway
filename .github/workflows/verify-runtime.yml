name: Verify test server runtime

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-remote-gateway-runtime-verify
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve expected deployment SHA
    if: github.event.issue.number == 4 && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      expected_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout deployment history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve latest deployment trigger commit
        id: target
        run: |
          set -euo pipefail
          sha=$(git log -1 --format=%H -- .deploy/trigger)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  verify-office:
    name: Verify office runtime (RTX2080)
    needs: resolve
    runs-on: ubuntu-latest
    # Legacy Environment name is retained only to reuse the existing office SSH auth material.
    environment: server-primary
    outputs:
      deployed_sha: ${{ steps.verify.outputs.deployed_sha }}
    steps:
      - name: Checkout verifier and target config
        uses: actions/checkout@v5

      - name: Load office target
        run: |
          set -euo pipefail
          source scripts/load-server-target.sh
          load_server_target office
          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_USER=$SSH_USER"
            echo "TARGET_NAME=$TARGET_NAME"
            echo "TARGET_RUNTIME=$TARGET_RUNTIME"
          } >> "$GITHUB_ENV"

      - name: Configure SSH authentication
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/verify_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/verify_key"
          test -s "$HOME/.ssh/known_hosts"

      - name: Verify deployed SHA, health, UI, and prior real-Codex smoke
        id: verify
        env:
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
        run: bash scripts/verify-remote-runtime.sh office

  verify-idc:
    name: Verify IDC runtime (data1)
    needs: [resolve, verify-office]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    # Legacy Environment name is retained only to reuse the existing IDC SSH auth material.
    environment: server-secondary
    outputs:
      deployed_sha: ${{ steps.verify.outputs.deployed_sha }}
    steps:
      - name: Checkout verifier and target config
        uses: actions/checkout@v5

      - name: Load IDC target
        run: |
          set -euo pipefail
          source scripts/load-server-target.sh
          load_server_target idc
          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_USER=$SSH_USER"
            echo "TARGET_NAME=$TARGET_NAME"
            echo "TARGET_RUNTIME=$TARGET_RUNTIME"
          } >> "$GITHUB_ENV"

      - name: Configure SSH authentication
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/verify_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/verify_key"
          test -s "$HOME/.ssh/known_hosts"

      - name: Verify deployed SHA, health, UI, and prior real-Codex smoke
        id: verify
        env:
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
        run: bash scripts/verify-remote-runtime.sh idc

  publish:
    name: Publish verification pointer
    needs: [resolve, verify-office, verify-idc]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
      OFFICE_RESULT: ${{ needs.verify-office.result }}
      IDC_RESULT: ${{ needs.verify-idc.result }}
    steps:
      - name: Update fixed verification issue
        run: |
          set -euo pipefail
          overall=FAIL
          if [ "$OFFICE_RESULT" = success ] && [ "$IDC_RESULT" = success ]; then
            overall=PASS
          fi

          body=$(cat <<EOF
          # Latest runtime verification

          - Overall: **$overall**
          - Expected deployment SHA: \`$EXPECTED_SHA\`
          - Office / RTX2080: \`$OFFICE_RESULT\`
          - IDC / data1: \`$IDC_RESULT\`
          - Checks: deployed SHA, Actuator health, browser UI/workspace API, prior real-Codex two-turn smoke/thread evidence
          - Workflow run: \`${GITHUB_RUN_ID}\`

          Host, port, and user are versioned as non-secret deployment metadata in \`config/server-targets.properties\`. Authentication keys and pinned SSH host keys remain GitHub Environment secrets.
          EOF
          )

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/4" \
            -f body="$body" >/dev/null

          echo "Runtime verification pointer updated: $overall"
