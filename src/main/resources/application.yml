spring:
  application:
    name: codex-remote-gateway

server:
  shutdown: graceful

gateway:
  agent:
    mode: ${GATEWAY_AGENT_MODE:in-memory}
  codex:
    command: ${GATEWAY_CODEX_COMMAND:codex}
    workspace-root: ${GATEWAY_CODEX_WORKSPACE_ROOT:/workspaces}
    codex-home: ${GATEWAY_CODEX_HOME:}
    approval-policy: ${GATEWAY_CODEX_APPROVAL_POLICY:never}
    sandbox: ${GATEWAY_CODEX_SANDBOX:workspace-write}
    model: ${GATEWAY_CODEX_MODEL:}
    turn-timeout: ${GATEWAY_CODEX_TURN_TIMEOUT:10m}
  antigravity:
    enabled: ${GATEWAY_ANTIGRAVITY_ENABLED:false}
    command: ${GATEWAY_ANTIGRAVITY_COMMAND:agy}
    model: ${GATEWAY_ANTIGRAVITY_MODEL:}
    turn-timeout: ${GATEWAY_ANTIGRAVITY_TURN_TIMEOUT:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
